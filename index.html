<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bicycle Clicker</title>
    <link rel="stylesheet" href="style/mainstyle.css">
    <link rel="shortcut icon" href="img/Verkeersbord.ico">
</head>

<body>
<div id="app">
    <div id="topbar">
        <h2>Meters per click: <span id="mpcCounter">1</span></h2>
        <h2>Meters per second: <span id="mpsCounter">0.0</span></h2>
        <div id="buffNotice"></div>
    </div>

    <div id="game">
        <div id="clickWindow">
            <h1>Meters: <span id="meterCounter">0</span></h1>
            <div id="bike">
                <button id="bikeButton">🦽</button>
            </div>
        </div>

        <div id="rightPanel">
            <!-- Buy mode window -->
            <div id="multiplierBar">
                <span class="mult-title">Buy mode:</span>
                <div class="mult-group">
                    <button class="multBtn active" data-mult="1">x1</button>
                    <button class="multBtn" data-mult="10">x10</button>
                    <button class="multBtn" data-mult="100">x100</button>
                    <button class="multBtn" data-mult="max">Max</button>
                </div>
            </div>

            <div id="upgradesContainer">
                <!-- amplificators upgrade window -->
                <div id="upgradesWindow">
                    <div class="section-title">Upgrades</div>
                    <div id="upgradesList"></div>
                </div>

                <!-- factories upgrade window -->
                <div id="upgradesWindow_factories">
                    <div class="section-title">Factories</div>
                    <div id="factoriesList"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="bottom_bar">
        <button id="resetGameButton">🗑️ Reset Game</button>
    </div>


    <script src="script/formatter.js"></script>
    <script src="script/factories.js"></script>
    <script src="script/app.js"></script>
    <script src="script/quicktime.js"></script>
</div>
</body>
</html>
